[package]
name = "macro-journal-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "macro_journal_server"
path = "src/lib.rs"

[[bin]]
name = "macro-journal-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
macro-journal-shared = { path = "../../crates/shared" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
